name: F-Droid release build

on:
  pull_request:
    paths:
      - '.github/workflows/fdroid-build.yml'
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'fdroid/**'
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

jobs:
  release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android build inputs
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Build unsigned release APK
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify F-Droid release output
        run: |
          apk=app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$apk"
          unzip -t "$apk"
          unzip -Z1 "$apk" > "$RUNNER_TEMP/dance-release-files.txt"
          grep -Fxq lib/arm64-v8a/libcoefficient_root_dance.so "$RUNNER_TEMP/dance-release-files.txt"
          grep -Fxq lib/x86_64/libcoefficient_root_dance.so "$RUNNER_TEMP/dance-release-files.txt"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" > "$RUNNER_TEMP/dance-release-badging.txt"
          grep -Fq "package: name='org.isomorphisms.coefficientrootdance' versionCode='1' versionName='0.1.0'" "$RUNNER_TEMP/dance-release-badging.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: coefficient-root-dance-fdroid-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
