name: Android native prototype

on:
  push:
  pull_request:

jobs:
  math:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check coefficient/root round trips
        run: |
          cc -std=c11 -Wall -Wextra -Werror \
            tests/polynomial_test.c app/src/main/cpp/polynomial.c -lm \
            -o /tmp/polynomial_test
          /tmp/polynomial_test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android toolchain
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: coefficient-root-dance-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  emulate:
    needs: [math, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/download-artifact@v4
        with:
          name: coefficient-root-dance-debug-apk
          path: artifacts

      - name: Enable KVM permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Smoke-test drag directions, multiplicity, and variable degree
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: medium_phone
          ram-size: 2048M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save -no-metrics
          script: |
            adb shell wm size 1280x720
            adb shell wm density 320
            adb install -r artifacts/app-debug.apk
            adb logcat -c
            adb shell am start -W -a android.intent.action.MAIN -c android.intent.category.LAUNCHER -n org.isomorphisms.coefficientrootdance/android.app.NativeActivity
            sleep 3

            adb exec-out screencap -p > before.png

            # c0 begins near (235, 248) at this viewport.
            adb shell input swipe 235 248 300 300 350
            # After that coefficient move root 0 is near (892, 299).
            adb shell input swipe 892 299 950 340 350
            sleep 2

            adb logcat -d > dance.log
            adb exec-out screencap -p > after.png
            adb shell pidof -s org.isomorphisms.coefficientrootdance | tr -d '\r' | grep -Eq '^[0-9]+$'
            grep -q 'drag start kind=1' dance.log
            grep -q 'drag end kind=1' dance.log
            grep -q 'drag start kind=2' dance.log
            grep -q 'drag end kind=2' dance.log
            ! grep -Eiq 'shader compilation failed|program link failed|eglInitialize failed|could not choose GLES3 EGL config|could not create EGL surface/context|eglMakeCurrent failed|root solve failed' dance.log
            ! cmp -s before.png after.png

            # Restart at the known initial polynomial, then move c0 and c1 to zero.
            # z^2 then has a double root at zero, which should draw concentric circles.
            adb shell am force-stop org.isomorphisms.coefficientrootdance
            for attempt in $(seq 1 20); do if ! adb shell pidof -s org.isomorphisms.coefficientrootdance >/dev/null 2>&1; then break; fi; sleep 0.25; done
            # Let the old NativeActivity window/input channel finish tearing down.
            sleep 1
            adb logcat -c
            adb shell am start -W -a android.intent.action.MAIN -c android.intent.category.LAUNCHER -n org.isomorphisms.coefficientrootdance/android.app.NativeActivity
            # NativeActivity can report started before its input queue is attached.
            sleep 3
            adb shell input swipe 235 248 320 360 350
            adb shell input swipe 320 383 320 360 350
            sleep 2
            adb logcat -d > repeated-root.log
            adb exec-out screencap -p > repeated-root.png
            adb shell pidof -s org.isomorphisms.coefficientrootdance | tr -d '\r' | grep -Eq '^[0-9]+$'
            grep -q 'drag start kind=1' repeated-root.log
            grep -q 'drag end kind=1' repeated-root.log
            ! grep -Eiq 'shader compilation failed|program link failed|eglInitialize failed|could not choose GLES3 EGL config|could not create EGL surface/context|eglMakeCurrent failed|root solve failed' repeated-root.log

            # Restart, raise the polynomial from degree 2 to degree 3, and drag c2.
            adb shell am force-stop org.isomorphisms.coefficientrootdance
            for attempt in $(seq 1 20); do if ! adb shell pidof -s org.isomorphisms.coefficientrootdance >/dev/null 2>&1; then break; fi; sleep 0.25; done
            # Let the old NativeActivity window/input channel finish tearing down.
            sleep 1
            adb logcat -c
            adb shell am start -W -a android.intent.action.MAIN -c android.intent.category.LAUNCHER -n org.isomorphisms.coefficientrootdance/android.app.NativeActivity
            # NativeActivity can report started before its input queue is attached.
            sleep 3
            adb shell input tap 596 44
            sleep 1
            adb shell input swipe 320 383 365 410 350
            sleep 2
            adb logcat -d > degree-three.log
            adb exec-out screencap -p > degree-three.png
            adb shell pidof -s org.isomorphisms.coefficientrootdance | tr -d '\r' | grep -Eq '^[0-9]+$'
            grep -q 'degree changed n=3' degree-three.log
            grep -q 'drag start kind=1 index=2' degree-three.log
            grep -q 'drag end kind=1 index=2' degree-three.log
            ! grep -Eiq 'shader compilation failed|program link failed|eglInitialize failed|could not choose GLES3 EGL config|could not create EGL surface/context|eglMakeCurrent failed|root solve failed' degree-three.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-evidence
          path: |
            dance.log
            before.png
            after.png
            repeated-root.log
            repeated-root.png
            degree-three.log
            degree-three.png
          if-no-files-found: warn
